server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Ассеты Vite содержат хеш в имени — кешируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: все неизвестные пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
