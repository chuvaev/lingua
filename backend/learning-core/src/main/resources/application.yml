# Значения по умолчанию смотрят на dev-инфраструктуру (./deploy.sh dev),
# поэтому из IDEA сервис стартует без дополнительных настроек.
# В Docker те же переменные задаёт compose.yaml.
server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: learning-core

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:lingua}?schema=learning
    username: ${DB_USER:lingua}
    password: ${DB_PASSWORD:lingua}

  # У каждого сервиса своя схема: сервисы не трогают чужие таблицы
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:lingua}
    user: ${DB_USER:lingua}
    password: ${DB_PASSWORD:lingua}
    schemas: learning
    default-schema: learning
    create-schemas: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

lingua:
  languagetool:
    url: ${LANGUAGETOOL_URL:http://localhost:18010}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
